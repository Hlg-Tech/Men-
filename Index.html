<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranchón El Coco - Menú Digital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cocoGreen: '#1b4332',
                        cocoGold: '#d4a373',
                        cocoSand: '#fefae0',
                        cocoDark: '#283618'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- ESTILOS PERSONALIZADOS PARA EL FONDO TROPICAL Y ANIMACIONES -->
    <style>
        :root {
            --coco-green: #1b4332;
            --coco-gold: #d4a373;
            --coco-sand: #fefae0;
            --coco-dark: #283618;
        }

        body {
            background-color: var(--coco-sand);
            color: var(--coco-dark);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 3rem;
            overflow-x: hidden;
        }

        /* Fondo tropical ambiental con movimiento sutil */
        .bg-tropical-wrapper {
            position: relative;
            min-height: 100vh;
        }
        .bg-tropical-wrapper::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?w=1200&auto=format&fit=crop&q=60');
            background-size: cover;
            background-position: center;
            opacity: 0.12; 
            z-index: -1;
            pointer-events: none;
            animation: gentleSway 20s ease-in-out infinite alternate;
        }

        @keyframes gentleSway {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.04) translate(-10px, -5px); }
        }

        .container-app {
            max-width: 28rem;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .glass-card:active {
            transform: scale(0.98);
        }

        .modal-enter {
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-tropical-wrapper" x-data="menuApp()">

    <!-- HEADER / LOGO -->
    <header class="bg-cocoGreen text-white text-center py-6 shadow-md border-b-2 border-cocoGold">
        <div class="container-app">
            <h1 class="text-3xl font-bold tracking-wider uppercase drop-shadow">Ranchón El Coco</h1>
            <p class="text-cocoGold text-sm italic mt-1 font-medium">Auténtico Sabor y Tradición Criolla Cubana</p>
        </div>
    </header>

    <main class="container-app mt-4 space-y-6">

        <!-- BANNER DE ANUNCIOS (Fundido Cruzado Infinito) -->
        <div class="relative w-full h-40 rounded-2xl overflow-hidden shadow-lg bg-gray-200 border border-cocoGold/30">
            <template x-for="(banner, index) in banners" :key="index">
                <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out flex items-center justify-center bg-cocoDark text-white p-4 text-center"
                     :class="activeBanner === index ? 'opacity-100 z-10' : 'opacity-0 z-0'">
                    <img :src="banner.img" alt="Anuncio" class="absolute inset-0 w-full h-full object-cover opacity-60">
                    <div class="relative z-20">
                        <h2 class="text-xl font-bold drop-shadow-md" x-text="banner.title"></h2>
                        <p class="text-sm drop-shadow-md mt-1" x-text="banner.subtitle"></p>
                    </div>
                </div>
            </template>
            <!-- Indicadores -->
            <div class="absolute bottom-2 left-0 right-0 flex justify-center space-x-2 z-30">
                <template x-for="(banner, index) in banners" :key="index">
                    <button class="w-2 h-2 rounded-full transition-all"
                            :class="activeBanner === index ? 'bg-white w-4' : 'bg-white/50'"
                            @click="activeBanner = index"></button>
                </template>
            </div>
        </div>

        <!-- BUSCADOR CON SUGERENCIAS -->
        <div class="relative" @click.away="showSuggestions = false">
            <div class="relative flex items-center">
                <input type="text" 
                       x-model="searchQuery" 
                       @focus="showSuggestions = true"
                       @input="showSuggestions = true"
                       @keyup.enter="closeKeyboard($event)"
                       placeholder="¿Qué se te antoja hoy? (ej. Ropa vieja, mojito...)" 
                       class="w-full px-4 py-3 pl-10 pr-10 rounded-xl bg-white/95 border border-cocoGold/50 focus:outline-none focus:ring-2 focus:ring-cocoGreen shadow-sm text-sm">
                
                <svg class="w-5 h-5 text-gray-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>

                <button x-show="searchQuery.length > 0" @click="searchQuery = ''; showSuggestions = false" class="absolute right-3 text-gray-400 hover:text-cocoDark">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Sugerencias -->
            <div x-show="showSuggestions && searchQuery.trim() !== '' && searchSuggestions.length > 0" 
                 class="absolute left-0 right-0 mt-1 bg-white rounded-xl shadow-lg border border-cocoGold/30 z-30 max-h-48 overflow-y-auto">
                <template x-for="dish in searchSuggestions" :key="dish.id">
                    <div @click="selectSuggestion(dish.name)" 
                         class="px-4 py-2.5 hover:bg-cocoSand/80 cursor-pointer flex justify-between items-center text-xs border-b border-gray-100 last:border-none">
                        <span class="font-medium text-cocoDark" x-text="dish.name"></span>
                        <span class="text-cocoGreen font-bold" x-text="dish.price"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- FILTROS POR CATEGORÍA -->
        <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
            <template x-for="cat in categories" :key="cat.id">
                <button @click="selectedCategory = cat.id"
                        class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all shadow-sm border border-cocoGold/30"
                        :class="selectedCategory === cat.id ? 'bg-cocoGreen text-white shadow-md border-transparent' : 'bg-white/90 text-cocoDark hover:bg-cocoGold/20'">
                    <span x-text="cat.name"></span>
                </button>
            </template>
        </div>

        <!-- RECOMENDACIONES DEL CHEF -->
        <template x-if="searchQuery === '' && selectedCategory === 'all'">
            <div class="space-y-4">
                <h3 class="text-lg font-bold text-cocoGreen border-b border-cocoGold/40 pb-1 flex items-center justify-between">
                    <span>🔥 Recomendaciones del Chef</span>
                </h3>
                <div class="grid grid-cols-1 gap-3">
                    <template x-for="dish in filteredDishes.filter(d => d.featured)" :key="dish.id">
                        <div @click="openModal(dish)" class="glass-card p-3 flex items-center space-x-3 cursor-pointer">
                            <img :src="dish.image" alt="Plato" class="w-20 h-20 object-cover rounded-lg bg-gray-100 flex-shrink-0">
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start">
                                    <h4 class="font-bold text-sm text-cocoDark truncate" x-text="dish.name"></h4>
                                    <span class="bg-cocoGold/30 text-cocoGreen text-[10px] font-bold px-2 py-0.5 rounded-full">¡Estrella!</span>
                                </div>
                                <p class="text-xs text-gray-600 mt-1 line-clamp-2" x-text="dish.description"></p>
                                <div class="mt-2 text-right font-bold text-cocoGreen text-sm" x-text="dish.price"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- LISTADO GENERAL CLASIFICADO POR CATEGORÍAS -->
        <div class="space-y-6">
            <template x-if="selectedCategory !== 'all' || searchQuery !== ''">
                <div class="space-y-4">
                    <h3 class="text-lg font-bold text-cocoGreen border-b border-cocoGold/40 pb-1" 
                        x-text="searchQuery !== '' ? 'Resultados de búsqueda' : categories.find(c => c.id === selectedCategory).name">
                    </h3>
                    <div class="grid grid-cols-1 gap-3">
                        <template x-for="dish in filteredDishes" :key="dish.id">
                            <div @click="openModal(dish)" class="glass-card p-3 flex items-center space-x-3 cursor-pointer">
                                <img :src="dish.image" alt="Plato" class="w-20 h-20 object-cover rounded-lg bg-gray-100 flex-shrink-0">
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-sm text-cocoDark truncate" x-text="dish.name"></h4>
                                    <p class="text-xs text-gray-600 mt-1 line-clamp-2" x-text="dish.description"></p>
                                    <div class="mt-2 text-right font-bold text-cocoGreen text-sm" x-text="dish.price"></div>
                                </div>
                            </div>
                        </template>
                        <div x-show="filteredDishes.length === 0" class="text-center py-8 text-gray-600 text-sm">
                            No encontramos platos con ese nombre en el menú 🥥.
                        </div>
                    </div>
                </div>
            </template>

            <!-- Menú completo separado por secciones -->
            <template x-if="selectedCategory === 'all' && searchQuery === ''">
                <div class="space-y-6">
                    <template x-for="cat in categories.filter(c => c.id !== 'all')" :key="cat.id">
                        <div class="space-y-3" x-show="dishes.some(d => d.category === cat.id)">
                            <h3 class="text-base font-bold text-cocoGreen border-b-2 border-cocoGold/40 pb-1 flex items-center space-x-2">
                                <span x-text="cat.name"></span>
                            </h3>
                            <div class="grid grid-cols-1 gap-3">
                                <template x-for="dish in dishes.filter(d => d.category === cat.id)" :key="dish.id">
                                    <div @click="openModal(dish)" class="glass-card p-3 flex items-center space-x-3 cursor-pointer">
                                        <img :src="dish.image" alt="Plato" class="w-20 h-20 object-cover rounded-lg bg-gray-100 flex-shrink-0">
                                        <div class="flex-1 min-w-0">
                                            <h4 class="font-bold text-sm text-cocoDark truncate" x-text="dish.name"></h4>
                                            <p class="text-xs text-gray-600 mt-1 line-clamp-2" x-text="dish.description"></p>
                                            <div class="mt-2 text-right font-bold text-cocoGreen text-sm" x-text="dish.price"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

    </main>

    <!-- VENTANA MODAL DE DETALLES DEL PLATO -->
    <div x-show="isModalOpen" 
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
         x-transition.opacity
         @click.self="closeModal()">
        
        <div class="bg-cocoSand w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl border border-cocoGold modal-enter relative"
             @click.stop>
            
            <!-- Botón cerrar -->
            <button @click="closeModal()" class="absolute top-3 right-3 z-10 bg-black/50 text-white rounded-full p-1.5 hover:bg-black/70 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <template x-if="activeDish">
                <div>
                    <!-- Imagen grande del modal -->
                    <div class="relative h-48 w-full">
                        <img :src="activeDish.image" alt="Detalle" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-cocoDark/80 via-transparent to-transparent"></div>
                        <div class="absolute bottom-3 left-4 right-4 text-white">
                            <span class="bg-cocoGold text-cocoDark text-[10px] font-bold px-2 py-0.5 rounded-full uppercase" x-text="activeDish.category"></span>
                            <h2 class="text-xl font-bold mt-1 drop-shadow" x-text="activeDish.name"></h2>
                        </div>
                    </div>

                    <!-- Contenido y descripción extendida -->
                    <div class="p-5 space-y-4 bg-white">
                        <div>
                            <h4 class="text-xs font-bold text-cocoGreen uppercase tracking-wider">Descripción</h4>
                            <p class="text-xs text-gray-700 mt-1 leading-relaxed" x-text="activeDish.description"></p>
                        </div>

                        <!-- Ingredientes detallados -->
                        <template x-if="activeDish.ingredients && activeDish.ingredients.length > 0">
                            <div>
                                <h4 class="text-xs font-bold text-cocoGreen uppercase tracking-wider">Ingredientes Principales</h4>
                                <div class="flex flex-wrap gap-1.5 mt-2">
                                    <template x-for="ing in activeDish.ingredients">
                                        <span class="bg-cocoSand text-cocoDark text-[11px] px-2.5 py-1 rounded-lg border border-cocoGold/30 font-medium" x-text="ing"></span>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Precio y botón de acción -->
                        <div class="pt-2 border-t border-gray-100 flex items-center justify-between">
                            <span class="text-xs text-gray-500 font-medium">Precio final</span>
                            <span class="text-xl font-extrabold text-cocoGreen" x-text="activeDish.price"></span>
                        </div>

                        <button @click="closeModal()" class="w-full bg-cocoGreen text-white text-xs font-bold py-3 rounded-xl shadow hover:bg-cocoDark transition-colors">
                            Cerrar y volver al menú
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center mt-12 text-xs text-gray-500">
        <p>Ranchón El Coco &copy; 2026 - Hecho para disfrutar en familia</p>
    </footer>

    <!-- LÓGICA DE LA APLICACIÓN (JAVASCRIPT) -->
    <script>
        function menuApp() {
            return {
                searchQuery: '',
                selectedCategory: 'all',
                activeBanner: 0,
                showSuggestions: false,
                isModalOpen: false,
                activeDish: null,
                banners: [
                    { title: '¡Especial de la Casa!', subtitle: 'Disfruta nuestro congrí criollo con lechón asado.', img: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=60' },
                    { title: 'Coctelería Tradicional', subtitle: 'Los mejores mojitos y piñas coladas bien frías.', img: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=600&auto=format&fit=crop&q=60' },
                    { title: 'Postres de la Abuela', subtitle: 'Prueba nuestro flan de leche cubano y casquitos de guayaba.', img: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600&auto=format&fit=crop&q=60' }
                ],
                categories: [
                    { id: 'all', name: 'Todo el Menú' },
                    { id: 'bebidas', name: 'Tragos y Bebidas' },
                    { id: 'entradas', name: 'Entradas' },
                    { id: 'fuertes', name: 'Platos Fuertes' },
                    { id: 'postres', name: 'Postres' }
                ],
                dishes: [
                    { 
                        id: 1, 
                        name: 'Ropa Vieja Criolla', 
                        category: 'fuertes', 
                        price: '$1,800 CUP', 
                        description: 'Desmenuzada de res en salsa criolla tradicional con sofrito, pimientos y un toque de vino.', 
                        ingredients: ['Carne de res seleccionada', 'Salsa de tomate artesanal', 'Vino seco', 'Pimientos morrones', 'Cebolla y ajo criollo'],
                        image: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300&auto=format&fit=crop&q=60', 
                        featured: true 
                    },
                    { 
                        id: 2, 
                        name: 'Mojito Cubano Tradicional', 
                        category: 'bebidas', 
                        price: '$600 CUP', 
                        description: 'Ron blanco, hierbabuena fresca, azúcar, jugo de limón y soda con hielo frappé.', 
                        ingredients: ['Ron blanco añejo', 'Hierbabuena fresca del huerto', 'Jugo de limón sutil', 'Azúcar blanca', 'Soda fría'],
                        image: 'https://images.unsplash.com/photo-1551538827-9c037cb4f32a?w=300&auto=format&fit=crop&q=60', 
                        featured: true 
                    },
                    { 
                        id: 3, 
                        name: 'Tostones Rellenos de Ropa Vieja', 
                        category: 'entradas', 
                        price: '$900 CUP', 
                        description: 'Canasticas de plátano verde frito crujiente rellenas de carne jugosa.', 
                        ingredients: ['Plátano verde macho', 'Ropa vieja desmenuzada', 'Aceite vegetal', 'Sal marina'],
                        image: 'https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=300&auto=format&fit=crop&q=60', 
                        featured: false 
                    },
                    { 
                        id: 4, 
                        name: 'Flan de Leche Casero', 
                        category: 'postres', 
                        price: '$500 CUP', 
                        description: 'Postre tradicional cubano con caramelo dorado y textura suave.', 
                        ingredients: ['Leche condensada', 'Huevos frescos', 'Caramelo líquido artesanal', 'Vainilla'],
                        image: 'https://images.unsplash.com/photo-1527049971077-226127116790?w=300&auto=format&fit=crop&q=60', 
                        featured: true 
                    }
                ],
                init() {
                    setInterval(() => {
                        this.activeBanner = (this.activeBanner + 1) % this.banners.length;
                    }, 4000);
                },
                openModal(dish) {
                    this.activeDish = dish;
                    this.isModalOpen = true;
                },
                closeModal() {
                    this.isModalOpen = false;
                    setTimeout(() => { this.activeDish = null; }, 200);
                },
                closeKeyboard(event) {
                    event.target.blur();
                    this.showSuggestions = false;
                },
                selectSuggestion(name) {
                    this.searchQuery = name;
                    this.showSuggestions = false;
                },
                get searchSuggestions() {
                    if (this.searchQuery.trim() === '') return [];
                    return this.dishes.filter(dish => 
                        dish.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                        dish.description.toLowerCase().includes(this.searchQuery.toLowerCase())
                    ).slice(0, 5);
                },
                get filteredDishes() {
                    return this.dishes.filter(dish => {
                        const matchesCategory = this.selectedCategory === 'all' || dish.category === this.selectedCategory;
                        const matchesSearch = dish.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                              dish.description.toLowerCase().includes(this.searchQuery.toLowerCase());
                        return matchesCategory && matchesSearch;
                    });
                }
            }
        }
    </script>
</body>
</html>
